name: release

# Pushing a v* tag builds the release archives and publishes them. `make release`
# runs the tests and vet first, so a broken tag never becomes a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so the version can be described

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build archives
        run: make release VERSION=${{ github.ref_name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-version:refname | grep -Fxv "$TAG" | head -1 || true)
          {
            printf 'A daemon that keeps a local folder in sync with iCloud on Linux: iCloud Drive two-way (inotify + polling), photo library download-only.\n\n'
            printf '## Install (no Go toolchain needed)\n\n'
            printf '```bash\n'
            printf 'curl -fsSL https://github.com/%s/releases/latest/download/icloud-synk-linux-amd64.tar.gz \\\n' "$REPO"
            printf '  | tar -xz --strip-components=1 -C /tmp icloud-synk-linux-amd64/icloud-synk\n'
            printf 'install -Dm755 /tmp/icloud-synk ~/.local/bin/icloud-synk\n'
            printf 'icloud-synk login --dir ~/iCloud\n'
            printf '```\n\n'
            printf 'Swap `amd64` for `arm64` on ARM machines. The binaries are static and CGO-free, so any glibc/musl system works. Each tarball also contains `icloud-synk.service` and both READMEs; verify downloads with `sha256sum -c SHA256SUMS --ignore-missing`.\n\n'
            printf 'Documentation: [README.md](https://github.com/%s/blob/%s/README.md) · [README_RU.md](https://github.com/%s/blob/%s/README_RU.md)\n' "$REPO" "$TAG" "$REPO" "$TAG"
            if [ -n "$prev" ]; then
              printf '\n**Changes:** https://github.com/%s/compare/%s...%s\n' "$REPO" "$prev" "$TAG"
            fi
          } > notes.md
          # Re-running the workflow for an existing tag replaces the assets
          # instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "$TAG" --notes-file notes.md --verify-tag
          fi
